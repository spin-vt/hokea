# Builds the documentation site with MkDocs and publishes it to GitHub Pages
# on every push to main. Enable Pages once in the repository settings:
# Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates the Pages site on first run if it does not exist yet
      # (source: GitHub Actions). Harmless once it exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
